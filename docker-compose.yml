version: '3.8'

services:
  cantina-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: cantina-backend
    ports:
      - "8000:8000"
    volumes:
      # Persistir banco de dados e backups via named volume
      - cantina_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cantina_data:

